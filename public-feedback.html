<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Project Feedback</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="main" style="margin-left:0;max-width:700px;margin:auto;padding:30px;">
  <section class="hero">
    <div class="tag">LEMYU FIBER OPTIC INSTALLATION AND SERVICES</div>
    <h1>Client Feedback Form</h1>
    <p>Please submit your evaluation for this project.</p>
  </section>

  <section class="card">
    <form id="publicFeedbackForm">
      <label>Client Name</label>
      <input id="client_name" required>

      <label>Rating</label>
      <input id="rating" type="number" min="1" max="5" required>

      <label>Comments</label>
      <textarea id="comments"></textarea>

      <label>Recommendations</label>
      <textarea id="recommendations"></textarea>

      <div class="form-actions">
        <button type="submit">Submit Feedback</button>
      </div>
    </form>
  </section>
</main>

<script type="module" src="js/app.js?v=20260727-finance-no-audit-v22"></script>

</body>
</html>
