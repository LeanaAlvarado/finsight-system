<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Project Feedback</title>
<link rel="stylesheet" href="style.css?v=20260808-optional-column-save-v115">
</head>
<body>

<main class="main" style="margin-left:0;max-width:700px;margin:auto;padding:30px;">
  <section class="hero">
    <div class="tag">LEMYU FIBER OPTIC INSTALLATION AND SERVICES</div>
    <h1>Client Feedback Form</h1>
    <p>Please submit your evaluation for this project.</p>
  </section>

  <section class="card">
    <form id="publicFeedbackForm">
      <label>Client Name</label>
      <input id="client_name" required>

      <label>Rating</label>
      <select id="rating" required>
        <option value="">Select rating</option>
        <option value="1">1 - Lowest</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5 - Highest</option>
      </select>
      <label>Comments</label>
      <textarea id="comments"></textarea>

      <label>Recommendations</label>
      <textarea id="recommendations"></textarea>

      <div class="form-actions">
        <button type="submit">Submit Feedback</button>
      </div>
    </form>
  </section>
</main>

<script type="module" src="js/app.js?v=20260808-optional-column-save-v115"></script>

</body>
</html>
