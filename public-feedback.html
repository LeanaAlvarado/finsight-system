<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Project Feedback</title>
<link rel="stylesheet" href="style.css?v=20260812-contract-modal-fix-v179">
</head>
<body>

<main class="public-feedback-page">
  <section class="feedback-form-header">
    <div class="tag">LEMYU FIBER OPTIC INSTALLATION AND SERVICES</div>
    <h1>Client Feedback Form</h1>
    <p>Please rate our service and share your feedback.</p>
  </section>

  <section class="public-feedback-card">
    <form id="publicFeedbackForm" class="formal-feedback-form">
      <p class="required-note">Fields marked with * are required.</p>

      <div class="formal-feedback-row">
        <label for="client_name">1. Client Name *</label>
        <input id="client_name" placeholder="Enter your full name" required>
      </div>

      <div class="formal-feedback-row">
        <label for="project_service">2. Project / Service Availed *</label>
        <input id="project_service" placeholder="Enter the project or service availed" required>
      </div>

      <div class="formal-feedback-row compact-field">
        <label for="feedback_date">3. Date *</label>
        <input id="feedback_date" type="date" required>
      </div>

      <fieldset class="formal-rating-row">
        <legend>4. Overall Rating *</legend>
        <label>
          <input type="radio" name="rating" value="1" required>
          <span>1</span>
          <small>Poor</small>
        </label>
        <label>
          <input type="radio" name="rating" value="2">
          <span>2</span>
          <small>Fair</small>
        </label>
        <label>
          <input type="radio" name="rating" value="3">
          <span>3</span>
          <small>Good</small>
        </label>
        <label>
          <input type="radio" name="rating" value="4">
          <span>4</span>
          <small>Very Good</small>
        </label>
        <label>
          <input type="radio" name="rating" value="5">
          <span>5</span>
          <small>Excellent</small>
        </label>
      </fieldset>

      <div class="formal-feedback-row textarea-row">
        <label for="comments">5. Comment *</label>
        <textarea id="comments" placeholder="Share your feedback about our service" required></textarea>
      </div>

      <div class="formal-feedback-row textarea-row">
        <label for="recommendations">6. Recommendations</label>
        <textarea id="recommendations" placeholder="How can we improve?"></textarea>
      </div>

      <div class="formal-feedback-actions">
        <button type="submit">Submit Feedback</button>
      </div>
    </form>
  </section>
</main>

<script type="module" src="js/app.js?v=20260812-contract-modal-fix-v179"></script>

</body>
</html>
