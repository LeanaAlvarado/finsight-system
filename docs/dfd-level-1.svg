<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-family:Arial,sans-serif;font-size:34px;font-weight:700;fill:#0f172a}
      .label{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#111827}
      .small{font-family:Arial,sans-serif;font-size:13px;fill:#334155}
      .entity{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .process{fill:#eef2ff;stroke:#4f46e5;stroke-width:3}
      .store{fill:#ecfeff;stroke:#0891b2;stroke-width:2}
      .flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#ffffff"/>
  <text x="900" y="55" text-anchor="middle" class="title">Level 1 Data Flow Diagram of FinSight</text>
  <text x="900" y="85" text-anchor="middle" class="small">Major processes, users, and data stores of the proposed system</text>

  <rect x="65" y="130" width="220" height="72" rx="6" class="entity"/>
  <text x="175" y="160" text-anchor="middle" class="label">Owner / Administrator</text>
  <text x="175" y="183" text-anchor="middle" class="small">Views project reports</text>

  <rect x="65" y="500" width="220" height="72" rx="6" class="entity"/>
  <text x="175" y="530" text-anchor="middle" class="label">Staff</text>
  <text x="175" y="553" text-anchor="middle" class="small">Encodes records and files</text>

  <rect x="65" y="900" width="220" height="72" rx="6" class="entity"/>
  <text x="175" y="930" text-anchor="middle" class="label">Client / Feedback User</text>
  <text x="175" y="953" text-anchor="middle" class="small">Submits feedback</text>

  <circle cx="505" cy="160" r="75" class="process"/>
  <text x="505" y="150" text-anchor="middle" class="label">1.0 User Login</text>
  <text x="505" y="174" text-anchor="middle" class="small">Access Control</text>

  <circle cx="505" cy="355" r="82" class="process"/>
  <text x="505" y="342" text-anchor="middle" class="label">2.0 Manage</text>
  <text x="505" y="365" text-anchor="middle" class="label">Projects and Contracts</text>

  <circle cx="505" cy="570" r="82" class="process"/>
  <text x="505" y="558" text-anchor="middle" class="label">3.0 Manage</text>
  <text x="505" y="581" text-anchor="middle" class="label">Inventory Materials</text>

  <circle cx="505" cy="790" r="82" class="process"/>
  <text x="505" y="778" text-anchor="middle" class="label">4.0 Manage</text>
  <text x="505" y="801" text-anchor="middle" class="label">Payroll and Expenses</text>

  <circle cx="940" cy="315" r="88" class="process"/>
  <text x="940" y="302" text-anchor="middle" class="label">5.0 Generate</text>
  <text x="940" y="325" text-anchor="middle" class="label">Revenue and BI Reports</text>

  <circle cx="940" cy="600" r="88" class="process"/>
  <text x="940" y="588" text-anchor="middle" class="label">6.0 Generate</text>
  <text x="940" y="611" text-anchor="middle" class="label">Project Reports</text>

  <circle cx="940" cy="905" r="82" class="process"/>
