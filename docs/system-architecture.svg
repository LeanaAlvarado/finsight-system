<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">LEMYU System Architecture</title>
  <desc id="desc">Architecture diagram for the LEMYU Supabase system showing users, browser frontend, local storage, Supabase services, database tables, and OTP email delivery.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panel-soft { fill: #f8fafc; stroke: #d7dee8; stroke-width: 2; }
      .client { fill: #e0f2fe; stroke: #0284c7; }
      .app { fill: #ecfdf5; stroke: #059669; }
      .local { fill: #fff7ed; stroke: #ea580c; }
      .cloud { fill: #eef2ff; stroke: #4f46e5; }
      .external { fill: #fdf2f8; stroke: #db2777; }
      .storage { fill: #f8fafc; stroke: #475569; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .heading { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 8 7; }
      .arrow-cloud { stroke: #4f46e5; stroke-width: 2.5; fill: none; marker-end: url(#arrow-cloud); }
      .arrow-sync { stroke: #ea580c; stroke-width: 2.5; fill: none; marker-end: url(#arrow-sync); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-cloud" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f46e5" />
    </marker>
    <marker id="arrow-sync" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect class="bg" width="1400" height="900" />

  <text x="64" y="62" class="title">LEMYU Supabase System Architecture</text>
  <text x="64" y="91" class="subtitle">Static HTML and JavaScript frontend with local browser persistence, Supabase cloud database/auth, and OTP email delivery.</text>

  <rect x="50" y="128" width="210" height="165" rx="14" class="panel client" filter="url(#shadow)" />
  <text x="82" y="170" class="heading">System Users</text>
  <text x="82" y="202" class="small">Owner / Admin</text>
  <text x="82" y="226" class="small">Finance Staff</text>
  <text x="82" y="250" class="small">Operations Staff</text>

  <rect x="315" y="115" width="455" height="565" rx="18" class="panel" filter="url(#shadow)" />
  <text x="350" y="157" class="heading">Browser Frontend</text>
  <text x="350" y="181" class="small">HTML pages loaded in the user's browser</text>

  <rect x="345" y="215" width="180" height="86" rx="10" class="panel-soft app" />
  <text x="366" y="248" class="label">Login UI</text>
  <text x="366" y="273" class="tiny">index.html, login.js</text>

  <rect x="555" y="215" width="185" height="86" rx="10" class="panel-soft app" />
  <text x="578" y="248" class="label">App Shell</text>
  <text x="578" y="273" class="tiny">app.js, auth-guard.js</text>

  <rect x="345" y="330" width="395" height="135" rx="10" class="panel-soft app" />
  <text x="370" y="364" class="label">Business Modules</text>
  <text x="370" y="392" class="tiny">Dashboard, Projects, Inventory, Payroll and Expenses</text>
  <text x="370" y="417" class="tiny">Revenue, Feedback, Reports and Audit Logs</text>
  <text x="370" y="442" class="tiny">User and Role Management</text>

  <rect x="345" y="495" width="180" height="105" rx="10" class="panel-soft local" />
  <text x="368" y="530" class="label">Session Security</text>
  <text x="368" y="556" class="tiny">roles and permissions</text>
  <text x="368" y="579" class="tiny">lockout and timeout</text>

  <rect x="555" y="495" width="185" height="105" rx="10" class="panel-soft local" />
  <text x="580" y="530" class="label">Local Storage</text>
  <text x="580" y="556" class="tiny">offline-style data cache</text>
  <text x="580" y="579" class="tiny">lemyu_* browser keys</text>

  <rect x="825" y="115" width="525" height="565" rx="18" class="panel cloud" filter="url(#shadow)" />
  <text x="860" y="157" class="heading">Supabase Cloud Backend</text>
  <text x="860" y="181" class="small">Hosted API, Auth, Edge Function, and PostgreSQL tables</text>

  <rect x="860" y="215" width="190" height="90" rx="10" class="panel-soft cloud" />
  <text x="887" y="249" class="label">Supabase Auth</text>
  <text x="887" y="274" class="tiny">email OTP sign in</text>

  <rect x="1120" y="215" width="190" height="90" rx="10" class="panel-soft cloud" />
  <text x="1146" y="249" class="label">Edge Function</text>
  <text x="1146" y="274" class="tiny">send-login-otp</text>

  <rect x="860" y="340" width="450" height="235" rx="10" class="storage" />
  <text x="890" y="374" class="label">PostgreSQL Tables</text>
  <text x="890" y="405" class="tiny">projects</text>
  <text x="1045" y="405" class="tiny">inventory</text>
  <text x="1195" y="405" class="tiny">material_catalog</text>
  <text x="890" y="435" class="tiny">users</text>
  <text x="1045" y="435" class="tiny">roles</text>
  <text x="1195" y="435" class="tiny">smart_contracts</text>
  <text x="890" y="465" class="tiny">project_files</text>
  <text x="1045" y="465" class="tiny">app_local_storage</text>
  <text x="1195" y="465" class="tiny">cloud_sync_audit</text>
  <text x="890" y="512" class="small">Stores cloud records and mirrors selected browser data.</text>
  <text x="890" y="539" class="small">Read/write access is performed by Supabase JS client calls.</text>

  <rect x="927" y="610" width="320" height="48" rx="10" class="panel-soft cloud" />
  <text x="958" y="640" class="label">Supabase JavaScript Client</text>

  <rect x="1000" y="730" width="265" height="100" rx="14" class="panel external" filter="url(#shadow)" />
  <text x="1033" y="770" class="heading">Email Delivery</text>
  <text x="1033" y="801" class="small">Google Apps Script</text>
  <text x="1033" y="824" class="small">sends OTP email to users</text>

  <rect x="83" y="730" width="715" height="100" rx="14" class="panel-soft" />
  <text x="118" y="768" class="label">Main Data Flow</text>
  <text x="118" y="798" class="small">Users work in browser pages. Modules save session and business data locally, then cloud-sync.js and cloud-local-storage.js hydrate, mirror, and upsert records to Supabase.</text>

  <path d="M260 210 C285 210, 290 258, 340 258" class="arrow" />
  <text x="278" y="203" class="tiny">uses app</text>

  <path d="M525 258 H555" class="arrow-soft" />
  <path d="M648 301 V330" class="arrow-soft" />
  <path d="M525 548 H555" class="arrow-sync" />
  <text x="465" y="635" class="tiny">auth state and app records saved locally</text>
  <path d="M435 600 C435 642, 610 642, 647 600" class="arrow-sync" />

  <path d="M740 258 C790 258, 810 258, 860 258" class="arrow-cloud" />
  <text x="766" y="242" class="tiny">OTP auth</text>

  <path d="M740 397 C796 397, 810 455, 860 455" class="arrow-cloud" />
  <text x="763" y="391" class="tiny">CRUD records</text>

  <path d="M648 600 C715 665, 854 668, 927 640" class="arrow-sync" />
  <text x="714" y="696" class="tiny">hydrate, restore, mirror, sync</text>

  <path d="M1087 610 V575" class="arrow-cloud" />
  <path d="M1087 610 C1087 590, 955 586, 955 305" class="arrow-cloud" />

  <path d="M1050 260 H1120" class="arrow-cloud" />
  <text x="1059" y="247" class="tiny">optional OTP email service</text>

  <path d="M1215 305 V730" class="arrow" />
  <text x="1227" y="520" class="tiny">POST email request</text>

  <path d="M1000 781 C750 842, 331 842, 156 293" class="arrow-soft" />
  <text x="540" y="858" class="tiny">OTP received by user email, then user verifies code in Login UI</text>

  <rect x="345" y="625" width="395" height="31" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="370" y="646" class="tiny">Public feedback page is available without protected app session.</text>

  <text x="64" y="875" class="tiny">Generated from project files: HTML pages, js/app.js, js/login.js, js/cloud-sync.js, js/cloud-local-storage.js, js/supabase.js, and supabase/functions/send-login-otp/index.ts.</text>
</svg>
