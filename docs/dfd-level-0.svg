<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
      .label{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#111827}
      .small{font-family:Arial,sans-serif;font-size:15px;fill:#334155}
      .entity{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .process{fill:#eef2ff;stroke:#4f46e5;stroke-width:3}
      .store{fill:#ecfeff;stroke:#0891b2;stroke-width:2}
      .flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="850" fill="#ffffff"/>
  <text x="700" y="55" text-anchor="middle" class="title">Level 0 Data Flow Diagram of FinSight</text>
  <text x="700" y="85" text-anchor="middle" class="small">Context Diagram for LEMYU Fiber Optic Installation and Services</text>

  <rect x="70" y="150" width="245" height="86" rx="6" class="entity"/>
  <text x="192.5" y="185" text-anchor="middle" class="label">Owner / Administrator</text>
  <text x="192.5" y="210" text-anchor="middle" class="small">Views project reports</text>

  <rect x="70" y="370" width="245" height="86" rx="6" class="entity"/>
  <text x="192.5" y="405" text-anchor="middle" class="label">Staff</text>
  <text x="192.5" y="430" text-anchor="middle" class="small">Encodes business records</text>

  <rect x="70" y="590" width="245" height="86" rx="6" class="entity"/>
  <text x="192.5" y="625" text-anchor="middle" class="label">Client / Feedback User</text>
  <text x="192.5" y="650" text-anchor="middle" class="small">Submits service feedback</text>

  <circle cx="705" cy="412" r="145" class="process"/>
  <text x="705" y="380" text-anchor="middle" class="label">FinSight</text>
  <text x="705" y="408" text-anchor="middle" class="small">Cloud-Based Financial Management</text>
  <text x="705" y="432" text-anchor="middle" class="small">System with Reports and Project Monitoring</text>

  <path d="M 1085 330 C 1215 330, 1215 495, 1085 495 C 955 495, 955 330, 1085 330" class="store"/>
  <line x1="1085" y1="330" x2="1085" y2="495" stroke="#0891b2" stroke-width="2"/>
  <text x="1085" y="400" text-anchor="middle" class="label">Supabase</text>
  <text x="1085" y="425" text-anchor="middle" class="small">Database and Storage</text>

  <path d="M 315 185 C 440 185, 500 290, 585 345" class="flow"/>
  <text x="430" y="195" class="small">View requests</text>
  <path d="M 585 385 C 495 310, 430 255, 315 215" class="flow"/>
  <text x="405" y="285" class="small">Summaries and reports</text>

  <path d="M 315 410 C 415 410, 500 410, 560 410" class="flow"/>
  <text x="365" y="398" class="small">Project, payroll, expense, inventory data</text>
  <path d="M 560 440 C 470 475, 390 470, 315 440" class="flow"/>
  <text x="380" y="492" class="small">Saved records and computed totals</text>

  <path d="M 315 625 C 450 610, 525 535, 595 480" class="flow"/>
  <text x="390" y="610" class="small">Ratings, comments, recommendations</text>
  <path d="M 590 510 C 480 665, 390 685, 315 650" class="flow"/>
  <text x="420" y="700" class="small">Feedback confirmation</text>

  <path d="M 850 395 C 900 382, 930 382, 955 395" class="flow"/>
  <text x="864" y="365" class="small">Save records and uploaded files</text>
  <path d="M 955 430 C 925 450, 895 450, 850 430" class="flow"/>
  <text x="870" y="480" class="small">Retrieve records and file links</text>
</svg>
